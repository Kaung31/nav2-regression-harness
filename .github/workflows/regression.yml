name: Nav2 regression suite

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nav2-harness -f docker/Dockerfile .
      - run: |
          docker run --rm -v ${{ github.workspace }}:/ws nav2-harness \
            bash -c "source /opt/ros/jazzy/setup.bash && \
                     python3 src/harness/run_batch.py --batch ${{ matrix.batch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: results-batch-${{ matrix.batch }}
          path: results/